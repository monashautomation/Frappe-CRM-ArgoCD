apiVersion: v1
kind: ServiceAccount
metadata:
  name: frappe-crm-eso
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: frappe-crm-vault
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "frappe-crm"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "frappe-crm"
          serviceAccountRef:
            name: frappe-crm-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frappe-crm-web-secrets
spec:
  secretStoreRef:
    name: frappe-crm-vault
    kind: SecretStore
  target:
    name: frappe-crm-web-secrets
  refreshInterval: 1h
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: web
        property: ADMIN_PASSWORD
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: web
        property: AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: web
        property: AUTHENTIK_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frappe-crm-mariadb-secrets
spec:
  secretStoreRef:
    name: frappe-crm-vault
    kind: SecretStore
  target:
    name: frappe-crm-mariadb-secrets
  refreshInterval: 1h
  data:
    - secretKey: MARIADB_ROOT_PASSWORD
      remoteRef:
        key: mariadb
        property: MARIADB_ROOT_PASSWORD
---
# GHCR pull secret, same name as the other apps use. Built from a read:packages token in
# OpenBao (frappe-crm/ghcr: username + token) so no cross-namespace secret copy is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frappe-crm-ghcr-pull-secret
spec:
  secretStoreRef:
    name: frappe-crm-vault
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  refreshInterval: 1h
  data:
    - secretKey: username
      remoteRef:
        key: ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: ghcr
        property: token
