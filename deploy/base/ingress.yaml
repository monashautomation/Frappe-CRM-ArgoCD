apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frappe-crm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - crm.monashautomation.com
      secretName: frappe-crm-tls
  rules:
    - host: crm.monashautomation.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frappe-crm-nginx
                port:
                  number: 80
