# Frappe runtime: gunicorn (web), nginx (static + routing), socketio (realtime),
# three RQ worker pools and the scheduler. All share the frappe-crm-sites RWX volume.
# Wave 2: after the bootstrap hook has written common_site_config.json and created the site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-crm-gunicorn
  labels:
    app: frappe-crm-gunicorn
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frappe-crm-gunicorn
  template:
    metadata:
      labels:
        app: frappe-crm-gunicorn
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gunicorn
          image: ghcr.io/monashautomation/frappe-crm:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # No args: image CMD (start.sh) runs gunicorn on :8000
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-crm-sites
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-crm-gunicorn
spec:
  selector:
    app: frappe-crm-gunicorn
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-crm-socketio
  labels:
    app: frappe-crm-socketio
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frappe-crm-socketio
  template:
    metadata:
      labels:
        app: frappe-crm-socketio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: socketio
          image: ghcr.io/monashautomation/frappe-crm:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-crm-sites
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-crm-socketio
spec:
  selector:
    app: frappe-crm-socketio
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-crm-nginx
  labels:
    app: frappe-crm-nginx
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frappe-crm-nginx
  template:
    metadata:
      labels:
        app: frappe-crm-nginx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/monashautomation/frappe-crm:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["nginx-entrypoint.sh"]
          env:
            - name: BACKEND
              value: frappe-crm-gunicorn:8000
            - name: SOCKETIO
              value: frappe-crm-socketio:9000
            - name: FRAPPE_SITE_NAME_HEADER
              valueFrom:
                configMapKeyRef:
                  name: frappe-crm-config
                  key: SITE_NAME
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: "127.0.0.1"
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"
            - name: UPSTREAM_REAL_IP_HEADER
              value: X-Forwarded-For
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: 50m
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-crm-sites
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-crm-nginx
spec:
  selector:
    app: frappe-crm-nginx
  ports:
    - port: 80
      targetPort: 8080
---
