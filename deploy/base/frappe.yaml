  name: frappe-crm-scheduler
  labels:
    app: frappe-crm-scheduler
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1 # must stay a singleton, or scheduled jobs run twice
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frappe-crm-scheduler
  template:
    metadata:
      labels:
        app: frappe-crm-scheduler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: ghcr.io/monashautomation/frappe-crm:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args: ["bench", "schedule"]
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: sites
          persistentVolumeClaim:
            claimName: frappe-crm-sites
        - name: logs
          emptyDir: {}
