apiVersion: v1
kind: ConfigMap
metadata:
  name: frappe-crm-config
data:
  # Frappe's site name doubles as the public hostname (nginx routes on it).
  SITE_NAME: "crm.monashautomation.com"
  DB_HOST: "frappe-crm-mariadb"
  REDIS_CACHE: "redis://frappe-crm-redis-cache:6379"
  REDIS_QUEUE: "redis://frappe-crm-redis-queue:6379"
  AUTHENTIK_BASE_URL: "https://auth.monashautomation.com"
  AUTHENTIK_PROVIDER_NAME: "authentik"
  # Scopes requested from Authentik. "groups" is needed so the ID token carries the
  # user's groups, which oidc_extended maps to Frappe Role Profiles at every login.
  AUTHENTIK_SCOPES: "openid email profile groups"
  # Group -> Frappe role mapping (applied by the bootstrap Job, enforced by oidc_extended
  # on every login, so changing a user's Authentik group changes their access next login).
  # Group names must match the Authentik groups exactly. A user in several groups gets the
  # union of their profiles. fallback_role_profiles is empty on purpose: someone in none of
  # the three groups gets no CRM roles. Also bind only these groups to the Authentik
  # application, so ungrouped users can't log in at all.
  #   crm-admin   -> System Manager (desk / full control) + CRM manager rights
  #   crm-manager -> Sales Manager (CRM settings, team-wide visibility)
  #   crm-user    -> Sales User (day-to-day CRM)
  # Inviting is a Sales Manager/System Manager action in CRM; it is blocked at the ingress
  # (see ingressroute.yaml) so all access is granted only through Authentik groups.
  SSO_ROLE_MAPPING: |
    {
      "role_profiles": {
        "CRM Admin": ["System Manager", "Sales Manager", "Sales User"],
        "CRM Sales Manager": ["Sales Manager", "Sales User"],
        "CRM Sales User": ["Sales User"]
      },
      "group_role_profiles": {
        "crm-admin": ["CRM Admin"],
        "crm-manager": ["CRM Sales Manager"],
        "crm-user": ["CRM Sales User"]
      },
      "fallback_role_profiles": []
    }
  # Fallback only, used when oidc_extended is not installed: role given to accounts created
  # by first SSO login. It has desk access, so Frappe promotes them to System User.
  SSO_DEFAULT_ROLE: "Sales User"
  # Set to "1" once SSO is verified to hide the username/password form. Keep "0" until
  # you are sure an Authentik outage can't lock you out (recovery then needs kubectl exec
  # into a Frappe pod: `bench --site <site> set-value "System Settings" disable_user_pass_login 0`).
  DISABLE_PASSWORD_LOGIN: "0"
