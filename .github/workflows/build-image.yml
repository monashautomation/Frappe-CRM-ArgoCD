name: Build image and deploy

# Frappe apps are baked into the image, so CRM is not in the stock frappe/erpnext
# image. Rebuild when the app list changes, weekly to pick up CRM/Frappe fixes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - image/**
      - .github/workflows/build-image.yml
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: ghcr.io/monashautomation/frappe-crm:sha-${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=image/apps.json

      # Pinned + checksum-verified (replaces `kustomize`, which ran an
      # unpinned npm package while this job holds a token that can push to main).
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.4.3
          KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
        run: |
          curl -fsSL -o /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tgz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tgz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
      - name: Bump overlay image tag
        env:
          IMAGE_SHA: sha-${{ github.sha }}
        run: |
          cd deploy/overlays/prod
          kustomize edit set image \
            "ghcr.io/monashautomation/frappe-crm=ghcr.io/monashautomation/frappe-crm:${IMAGE_SHA}"

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy sha-${{ github.sha }}"
          git pull --rebase
          git push
